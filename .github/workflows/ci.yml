name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: korea_market_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korea_market_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/korea_market_portal
      OPENDART_API_KEY: test-only
      INTERNAL_SYNC_SECRET: test-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate schema and TypeScript
        run: npm run check

      - name: Prepare isolated CI database
        run: npx prisma db push --skip-generate

      - name: Build application
        run: npm run build
